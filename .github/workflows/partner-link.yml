name: Integração autorizada com app parceiro

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: URL pública da página da IPA autorizada
        required: true
        default: https://www.mediafire.com/file/5fg7m86oicjzcet/EeveeSpotify-9.1.0-patched.ipa/file
        type: string
  push:
    paths:
      - 'partner-link/PartnerLink.m'
      - '.github/workflows/partner-link.yml'

jobs:
  inject-partner:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Baixar IPA autorizada
        env:
          SOURCE_URL: ${{ inputs.source_url || 'https://www.mediafire.com/file/5fg7m86oicjzcet/EeveeSpotify-9.1.0-patched.ipa/file' }}
        run: |
          python3 - <<'PY'
          import os, re, urllib.request
          page = urllib.request.urlopen(os.environ['SOURCE_URL']).read().decode('utf-8', 'ignore')
          matches = re.findall(r'https://download[^" ]+', page)
          if not matches:
              raise SystemExit('Não foi possível localizar o download direto da IPA')
          url = matches[0].replace('&amp;', '&')
          urllib.request.urlretrieve(url, '/tmp/partner.ipa')
          PY
          test -s /tmp/partner.ipa

      - name: Baixar e preparar IPA Inter hóspede
        run: |
          python3 - <<'PY'
          import re, urllib.request
          page = urllib.request.urlopen('https://www.mediafire.com/file/0ziscq1zuqz51zo/Inter.ipa/file').read().decode('utf-8', 'ignore')
          matches = re.findall(r'https://download[^" ]+', page)
          if not matches:
              raise SystemExit('Não foi possível localizar o download direto da Inter.ipa')
          urllib.request.urlretrieve(matches[0].replace('&amp;', '&'), '/tmp/inter.ipa')
          PY
          rm -rf /tmp/inter && mkdir -p /tmp/inter
          unzip -q /tmp/inter.ipa -d /tmp/inter
          GUEST=$(find /tmp/inter/Payload -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$GUEST"
          mkdir -p /tmp/inter-guest
          cp -R "$GUEST"/* /tmp/inter-guest/
          python3 - <<'PY'
          import struct
          p='/tmp/inter-guest/3105'
          b=bytearray(open(p,'rb').read())
          if struct.unpack_from('<I', b, 0)[0] != 0xfeedfacf:
              raise SystemExit('Inter não é Mach-O arm64 esperado')
          struct.pack_into('<I', b, 12, 0x6) # MH_DYLIB
          flags=struct.unpack_from('<I', b, 24)[0]
          struct.pack_into('<I', b, 24, flags & ~0x200000) # clear MH_PIE
          ncmds, sizeofcmds = struct.unpack_from('<II', b, 16)
          off=32
          text_fileoff=None
          dylinker_off=None
          has_id=False
          for _ in range(ncmds):
              cmd, cmdsize = struct.unpack_from('<II', b, off)
              if cmd == 0x19: # LC_SEGMENT_64
                  name=b[off+8:off+24].split(b'\0',1)[0]
                  if name == b'__PAGEZERO':
                      struct.pack_into('<QQ', b, off+24, 0x100000000-0x4000, 0x4000)
                  if name == b'__TEXT':
                      text_fileoff=struct.unpack_from('<Q', b, off+40)[0]
              if cmd == 0xd: # LC_ID_DYLIB
                  has_id=True
              if cmd == 0xe: # LC_LOAD_DYLINKER; can be repurposed by the loader
                  dylinker_off=off
              off += cmdsize
          if not has_id:
              name=b'InterGuest/3105\0'
              cmdsize=(24+len(name)+7)&~7
              insert=32+sizeofcmds
              if text_fileoff is not None and insert+cmdsize <= text_fileoff:
                  struct.pack_into('<II', b, insert, 0xd, cmdsize)
                  struct.pack_into('<I', b, insert+8, 24)
                  b[insert+24:insert+24+len(name)]=name
                  struct.pack_into('<I', b, 16, ncmds+1)
                  struct.pack_into('<I', b, 20, sizeofcmds+cmdsize)
              elif dylinker_off is not None:
                  oldsize=struct.unpack_from('<I', b, dylinker_off+4)[0]
                  short_name=b'3105\0'
                  if oldsize < 24+len(short_name):
                      raise SystemExit('Sem espaço para LC_ID_DYLIB')
                  struct.pack_into('<II', b, dylinker_off, 0xd, oldsize)
                  struct.pack_into('<I', b, dylinker_off+8, 24)
                  b[dylinker_off+24:dylinker_off+24+len(short_name)]=short_name
              else:
                  raise SystemExit('Sem espaço para LC_ID_DYLIB')
          open(p,'wb').write(b)
          PY

      - name: Instalar ferramenta insert_dylib
        run: |
          git clone --depth 1 https://github.com/tyilo/insert_dylib.git /tmp/insert_dylib
          cd /tmp/insert_dylib
          xcodebuild -project insert_dylib.xcodeproj -scheme insert_dylib -configuration Release -sdk macosx SYMROOT=/tmp/insert-build CODE_SIGNING_ALLOWED=NO
          cp /tmp/insert-build/Release/insert_dylib /usr/local/bin/insert_dylib
          chmod +x /usr/local/bin/insert_dylib

      - name: Compilar dylib de integração
        run: |
          xcrun --sdk iphoneos clang -dynamiclib -fobjc-arc -framework UIKit -framework Foundation -framework WebKit \
            -miphoneos-version-min=16.0 partner-link/PartnerLink.m \
            -o /tmp/PartnerLink.dylib

      - name: Preparar cópia do app parceiro
        run: |
          rm -rf /tmp/partner
          mkdir -p /tmp/partner
          unzip -q /tmp/partner.ipa -d /tmp/partner
          APP=$(find /tmp/partner/Payload -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP"
          cp /tmp/PartnerLink.dylib "$APP/PartnerLink.dylib"
          mkdir -p "$APP/InterGuest"
          cp -R /tmp/inter-guest/* "$APP/InterGuest/"
          insert_dylib --inplace --strip-codesig --all-yes \
            '@executable_path/PartnerLink.dylib' "$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          codesign --force --deep --sign - "$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry ../Spotify-partner-inter-link.ipa Payload

      - name: Enviar IPA parceira experimental
        uses: actions/upload-artifact@v4
        with:
          name: spotify-partner-inter-link
          path: Spotify-partner-inter-link.ipa
          if-no-files-found: error
