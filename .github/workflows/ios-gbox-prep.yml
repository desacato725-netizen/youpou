name: Preparar build iOS para GBox

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Verificar TypeScript
        run: pnpm check

      - name: Exportar bundle iOS
        run: npx expo export --platform ios --output-dir dist/ios

      - name: Empacotar projeto para o GBox
        run: |
          mkdir -p dist/gbox
          zip -qr dist/gbox/musicmenu-gbox-source.zip . \
            -x 'node_modules/*' \
            -x '.git/*' \
            -x 'dist/*' \
            -x '.expo/*'

      - name: Disponibilizar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: musicmenu-ios-gbox
          path: |
            dist/ios
            dist/gbox/musicmenu-gbox-source.zip
