name: Compilar IPA para GBox

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  ios-build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências JavaScript
        run: pnpm install --frozen-lockfile

      - name: Verificar TypeScript
        run: pnpm check

      - name: Gerar projeto nativo iOS
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Instalar Pods
        working-directory: ios
        run: pod install

      - name: Compilar app iOS sem assinatura
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" | awk '/Schemes:/{getline; gsub(/^ +| +$/, ""); print; exit}')
          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Empacotar IPA não assinada
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          rm -rf Payload dist
          mkdir -p Payload dist
          cp -R "$APP_PATH" Payload/
          (cd Payload && /usr/bin/ditto -c -k --sequesterRsrc . ../dist/musicmenu-unsigned.ipa)
          test -s dist/musicmenu-unsigned.ipa
          /usr/bin/unzip -tq dist/musicmenu-unsigned.ipa
          echo "IPA archive validated"

      - name: Enviar IPA e fonte para artefatos
        uses: actions/upload-artifact@v4
        with:
          name: musicmenu-ios-gbox
          path: |
            dist/musicmenu-unsigned.ipa
